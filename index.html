<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Jaan ❤️</title>
    <style>
        :root {
            --primary-color: #ff4d6d;
            --bg-color: #0a0a0a;
        }
        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
        }
        /* Floating Hearts Animation */
        .heart-bg {
            position: absolute;
            top: -10%;
            color: rgba(255, 77, 109, 0.3);
            font-size: 20px;
            animation: float 6s linear infinite;
            z-index: 1;
        }
        @keyframes float {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            width: 90%;
        }

        /* Pulsing Heart Button */
        #heart-btn {
            font-size: 80px;
            cursor: pointer;
            animation: pulse 1.5s infinite;
            display: inline-block;
            filter: drop-shadow(0 0 15px var(--primary-color));
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        h1 {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin-bottom: 10px;
            display: none;
        }

        /* Typewriter text styling */
        #message-box {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #ffb3c1;
            min-height: 100px;
            display: none;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="bg-container"></div>

    <div class="container">
        <div id="heart-btn">❤️</div>
        
        <h1 id="title">Happy Birthday, Jaan ❤️</h1>
        
        <div id="message-box"></div>
    </div>

    <script>
        // 1. Background Hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heart.style.opacity = Math.random();
            document.getElementById('bg-container').appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHeart, 300);

        // 2. Typewriter Effect
        const message = "Manta hoon thoda late ho gaya wish karne mein, par tumhare liye mera pyaar kabhi late nahi hoga kabhi kamm nahi hoga.Tum door ho toh kya hua, mere dil  mein ho aur uske har dharkan mein tum hi ho. Aaj tumhara Birthday bhool gaye per ye first and last time hoga aage se nahi hoga. aaj bahut hi special dil hai (0530 keliye) ayse nornal celebrate karne se kya hoga per abhi yahi per I promise, jab milenge toh sab kasar poora kar dunge. tab tak kekiye khush raho aapna dhiyan rakho aur humse bahut sara pyaar karte raho. Happy Birthday once again, Jaan! 🎂✨";

        const heartBtn = document.getElementById('heart-btn');
        const title = document.getElementById('title');
        const messageBox = document.getElementById('message-box');

        heartBtn.addEventListener('click', () => {
            heartBtn.style.display = 'none';
            title.style.display = 'block';
            messageBox.style.display = 'block';
            
            let i = 0;
            function typeWriter() {
                if (i < message.length) {
                    messageBox.innerHTML += message.charAt(i);
                    i++;
                    setTimeout(typeWriter, 50); // Speed of typing
                }
            }
            typeWriter();
        });
    </script>
</body>
</html>
